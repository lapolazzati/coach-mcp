[project]
name = "coach"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.70",
    "apscheduler>=3.10,<4",
    "python-telegram-bot>=21",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "garminconnect>=0.3,<0.4",
    "pillow>=11",
]

[project.optional-dependencies]
ingest = ["fitparse>=1.2", "fitdecode>=0.10"]
dev = ["pytest>=8", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coach*"]

[tool.setuptools.package-data]
coach = ["db/migrations/*.sql", "llm/prompts/*.md", "web/templates/*", "web/static/**/*"]
